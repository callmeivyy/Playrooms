<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Blackwood University</title>
  <style>
    :root {
      --bg: #0f1118;
      --card-bg: #141721;
      --border: #232736;
      --text: #e6e8f0;
      --text-muted: #8b92a5;
      --bubble-user: #181c28;
      --bubble-char: #141722;
      --ren-color: #3b82f6;
      --akira-color: #ef4444;
      --yuna-color: #d946ef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--bg);
    }

    header h1 {
      font-size: 1.25rem;
      font-family: "Times New Roman", Times, Georgia, serif;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .header-btns {
      display: flex;
      gap: 8px;
    }

    .top-btn {
      background: #171a26;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .top-btn:active {
      background: #202434;
    }

    #key-banner {
      background: #131622;
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: none;
      flex-direction: column;
      gap: 8px;
      font-size: 0.85rem;
    }

    .key-input-row {
      display: flex;
      gap: 8px;
    }

    #api-key-field {
      flex: 1;
      background: #090a10;
      border: 1px solid var(--border);
      color: #fff;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    #save-key-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
    }

    #chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      -webkit-overflow-scrolling: touch;
    }

    .message-row {
      display: flex;
      gap: 12px;
      max-width: 90%;
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-row.char {
      align-self: flex-start;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      border: 2px solid #282d40;
    }

    .avatar.ren { border-color: var(--ren-color); background-color: #1e3a8a; }
    .avatar.akira { border-color: var(--akira-color); background-color: #7f1d1d; }
    .avatar.yuna { border-color: var(--yuna-color); background-color: #701a75; }
    .avatar.user { border-color: #64748b; background-color: #334155; }

    .bubble-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bubble {
      padding: 14px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.55;
      word-break: break-word;
      border: 1px solid #1f2333;
    }

    .message-row.user .bubble {
      background: var(--bubble-user);
      border-top-right-radius: 4px;
      color: #e2e8f0;
    }

    .message-row.char .bubble {
      background: var(--bubble-char);
      border-top-left-radius: 4px;
      color: #e2e8f0;
    }

    .bubble em {
      color: #94a3b8;
      font-style: italic;
    }

    .status-error {
      color: #f87171;
      font-size: 0.78rem;
      margin-top: 4px;
      cursor: pointer;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .status-error span {
      border: 1px solid rgba(248, 113, 113, 0.4);
      padding: 2px 8px;
      border-radius: 12px;
      color: #fca5a5;
    }

    #footer-panel {
      padding: 12px 16px 24px 16px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    #character-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #character-pills::-webkit-scrollbar {
      display: none;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #141724;
      border: 1px solid #23283c;
      color: #8f97ad;
      padding: 5px 14px 5px 6px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
    }

    .pill-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
    }

    .pill.active.ren { border-color: var(--ren-color); color: #93c5fd; background: rgba(59, 130, 246, 0.12); }
    .pill.active.akira { border-color: var(--akira-color); color: #fca5a5; background: rgba(239, 68, 68, 0.12); }
    .pill.active.yuna { border-color: var(--yuna-color); color: #f0abfc; background: rgba(217, 70, 239, 0.12); }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    #text-box {
      flex: 1;
      background: #141724;
      border: 1px solid #23283c;
      color: #fff;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      resize: none;
      min-height: 48px;
      max-height: 120px;
      outline: none;
      line-height: 1.4;
    }

    #text-box:focus {
      border-color: #3b425a;
    }

    .send-actions {
      display: flex;
      gap: 6px;
    }

    .round-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #181b28;
      border: 1px solid #262b3d;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .round-btn:active {
      background: #222638;
    }

    .round-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .dots-loader {
      display: flex;
      gap: 4px;
      padding: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #94a3b8;
      border-radius: 50%;
      animation: blink 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }

<body>

  <header>

    <div class="header-btns">

  <div id="key-banner">

    <div class="key-input-row">
      <input type="password" id="api-key-field" placeholder="sk-or-v1-...">
      <button id="save-key-btn">Salvar</button>
    </div>
  </div>

  <div id="chat-scroll"></div>

  <div id="footer-panel">
    <div id="character-pills">
      <div class="pill active ren" data-char="ren">
        <div class="pill-avatar" style="background-color: #3b82f6;"></div>
        @Ren
      </div>
      <div class="pill akira" data-char="akira">
        <div class="pill-avatar" style="background-color: #ef4444;"></div>
        @Akira
      </div>
      <div class="pill yuna" data-char="yuna">
        <div class="pill-avatar" style="background-color: #d946ef;"></div>
        @Yuna
      </div>
    </div>

    <div class="input-row">
      <textarea id="text-box" rows="1" placeholder="Escreva sua cena..."></textarea>
      <div class="send-actions">
        <button class="round-btn" id="send-trigger">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="13 17 18 12 13 7"></polyline>
            <polyline points="6 17 11 12 6 7"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    const CHARS = {
      ren: {
        name: "Ren",
        color: "ren",
        prompt: `Você é Ren em Blackwood University. Um estudante calculista, imponente, magnético e de olhar penetrante.
Voz & Tom: Fala de forma pausada e firme, com sarcasmo sutil e segurança absoluta. Não usa clichês açucarados.
Relação: Atração intensa e visceral pela protagonista.
DIRETRIZ DE ROMANCE: todos são adultos. Em cenas íntimas, seja intenso e sensual (desejo, toque, respiração, sensações), tome iniciativa quando houver clima e respeite os sinais da protagonista, mas sem descrição sexual explícita: a cena faz uma elipse antes do ato e retoma depois.`
      },
      akira: {
        name: "Akira",
        color: "akira",
        prompt: `Você é Akira em Blackwood University. Impulsivo, intenso, rebelde e sem filtros sociais.
Voz & Tom: Direto, agressivo-sedutor, provocador e coloquial.
Relação: Quer desarmar a protagonista a qualquer custo com proximidade e pressão física.
DIRETRIZ DE ROMANCE: todos são adultos. Em cenas íntimas, seja intenso e sensual (desejo, toque, respiração, sensações), tome iniciativa quando houver clima e respeite os sinais da protagonista, mas sem descrição sexual explícita: a cena faz uma elipse antes do ato e retoma depois.`
      },
      yuna: {
        name: "Yuna",
        color: "yuna",
        prompt: `Você é Yuna em Blackwood University. Sedutora, misteriosa, psicológica e provocadora.
Voz & Tom: Sussurrada, intimista, suave e carregada de insinuações sensuais.
Relação: Proximidade física lenta, desestabilizando a protagonista com olhares e toques inesperados.
DIRETRIZ DE ROMANCE: todos são adultos. Em cenas íntimas, seja intenso e sensual (desejo, toque, respiração, sensações), tome iniciativa quando houver clima e respeite os sinais da protagonista, mas sem descrição sexual explícita: a cena faz uma elipse antes do ato e retoma depois.`
      }
    };

    const SYSTEM_DIRECTIVE = `[DIRETRIZ DE ROLEPLAY NARRATIVO ADULTO]
Escreva como uma webnovel imersiva para adultos.
- Formatação: use itálico (*ação*) para narração de gestos, ações corporais e sensações; texto puro para falas.
- Não quebre o personagem.
- A protagonista é Cassidy Lancaster: nunca fale, pense ou aja por ela.
- Cenas íntimas são sensuais e intensas, sem descrição sexual explícita: faça uma elipse antes do ato e retome depois.`;

    const STORAGE_KEY_HISTORY = 'blackwood_chat_history_v2';
    const STORAGE_KEY_API = 'openrouter_key';

    const INITIAL_SCENE = [{"role": "assistant", "char": "narr", "text": "O primeiro dia do semestre em Blackwood amanhece cinzento, mas o pátio principal está mais agitado que de costume. A notícia correu antes mesmo de o carro estacionar: a herdeira dos Lancaster, a família britânica tradicional cujo nome pesa tanto nos salões de Londres quanto nos conselhos de Nova York, decidiu estudar ali.\n\nNa escadaria da biblioteca, os três Kisaragi esperam. Eles já sabem quem ela é. Só não sabem ainda o que esperar dela."}, {"role": "assistant", "char": "ren", "text": "*Ren ajeita o punho da camisa sem tirar os olhos de você, a voz baixa e controlada.* \"Senhorita Lancaster. Meu pai comentou que sua família tem negócios em Boston. Não comentou que a herdeira viria pessoalmente se misturar conosco.\""}, {"role": "assistant", "char": "akira", "text": "*Akira desce dois degraus, a argola de prata no nariz refletindo a luz fria, e cruza os braços tatuados.* \"Relaxa, Ren. Ela não veio comprar a universidade.\" *Um meio sorriso marrento.* \"Pelo menos não hoje. Akira. E você deve estar cansada de gente fingindo que não sabe o seu sobrenome.\""}, {"role": "assistant", "char": "yuna", "text": "*Yuna surge entre os irmãos com um caderno de desenho debaixo do braço e um sorriso aberto.* \"Eu sou a Yuna! Ignora esses dois, eles treinam essa cara séria no espelho. Quer que eu te mostre o campus antes que o Ren te entregue um manual de regras?\""}];

    let history = [];
    let selectedChar = 'ren';

    // Elementos da interface
    const chatScroll = document.getElementById('chat-scroll');
    const textBox = document.getElementById('text-box');
    const sendTrigger = document.getElementById('send-trigger');
    const keyBanner = document.getElementById('key-banner');
    const apiKeyField = document.getElementById('api-key-field');
    const saveKeyBtn = document.getElementById('save-key-btn');
    const btnKey = document.getElementById('btn-key');
    const btnReset = document.getElementById('btn-reset');
    const pills = document.querySelectorAll('.pill');

    function loadSavedHistory() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY_HISTORY);
        const parsed = saved ? JSON.parse(saved) : null;
        if (Array.isArray(parsed) && parsed.length) {
          history = parsed;
        } else {
          history = [...INITIAL_SCENE];
        }
      } catch (e) {
        history = [...INITIAL_SCENE];
      }
    }

    function persistHistory() {
      try {
        localStorage.setItem(STORAGE_KEY_HISTORY, JSON.stringify(history));
      } catch (e) {
        console.error("Erro ao salvar histórico localmente:", e);
      }
    }

    function formatText(raw) {
      raw = String(raw || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      return raw.replace(/\*(.*?)\*/g, '<em>*$1*</em>');
    }

    function renderChat() {
      chatScroll.innerHTML = '';
      history.forEach((msg, idx) => {
        if (msg.char === 'narr') {
          const n = document.createElement('div');
          n.className = 'narr';
          n.innerHTML = formatText(msg.text);
          chatScroll.appendChild(n);
          return;
        }
        if (msg.role !== 'user') {
          const ck = msg.char || selectedChar;
          const blk = document.createElement('div');
          blk.className = 'char-block';
          const nm = (CHARS[ck] ? CHARS[ck].name : ck) + ' Kisaragi';
          let html = `<div class="char-head"><div class="avatar ${ck}"></div><div class="char-name">${nm}</div></div>`;
          String(msg.text || '').split(/(\*[^*]+\*)/).forEach(part => {
            const t = part.trim();
            if (!t) return;
            if (/^\*[^*]+\*$/.test(t)) {
              html += `<div class="char-act">${formatText(t.slice(1, -1))}</div>`;
            } else {
              const clean = t.replace(/^["“”]+|["“”]+$/g, '').trim();
              if (clean) html += `<div class="char-bubble">${formatText(clean)}</div>`;
            }
          });
          blk.innerHTML = html;
          chatScroll.appendChild(blk);
          return;
        }
        if (msg.role === 'user') {
          const blk = document.createElement('div');
          blk.className = 'cas-block';
          let html = `<div class="cas-head"><div class="char-name">Cassidy Lancaster</div><div class="avatar user"></div></div>`;
          String(msg.text || '').split(/("[^"]+"|“[^”]+”)/).forEach(part => {
            const t = part.trim();
            if (!t) return;
            if (/^["“].*["”]$/s.test(t)) {
              html += `<div class="cas-bubble">${formatText(t.slice(1, -1).trim())}</div>`;
            } else {
              t.split(/('[^']+'|‘[^’]+’)/).forEach(q => {
                const u = q.trim();
                if (!u) return;
                if (/^['‘].*['’]$/s.test(u)) html += `<div class="cas-act th">${formatText(u)}</div>`;
                else html += `<div class="cas-act">${formatText(u)}</div>`;
              });
            }
          });
          blk.innerHTML = html;
          if (msg.error) {
            const errBox = document.createElement('div');
            errBox.className = 'status-error';
            errBox.innerHTML = `! Não enviada. <span>Enviar novamente</span>` + (msg.errText ? `<small>${formatText(msg.errText)}</small>` : '');
            errBox.onclick = () => retryMessage(idx);
            blk.appendChild(errBox);
          }
          chatScroll.appendChild(blk);
          return;
        }
        const row = document.createElement('div');
        row.className = `message-row ${msg.role === 'user' ? 'user' : 'char'}`;

        const avatar = document.createElement('div');
        avatar.className = `avatar ${msg.role === 'user' ? 'user' : (msg.char || selectedChar)}`;
        row.appendChild(avatar);

        const bubbleWrapper = document.createElement('div');
        bubbleWrapper.className = 'bubble-wrapper';

        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = formatText(msg.text);
        bubbleWrapper.appendChild(bubble);

        if (msg.error) {
          const errBox = document.createElement('div');
          errBox.className = 'status-error';
          errBox.innerHTML = `! Não enviada. <span>Enviar novamente</span>` + (msg.errText ? `<small>${formatText(msg.errText)}</small>` : '');
          errBox.onclick = () => retryMessage(idx);
          bubbleWrapper.appendChild(errBox);
        }

        row.appendChild(bubbleWrapper);
        chatScroll.appendChild(row);
      });

      chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    pills.forEach(pill => {
      pill.onclick = () => {
        pills.forEach(p => p.classList.remove('active', 'ren', 'akira', 'yuna'));
        selectedChar = pill.dataset.char;
        pill.classList.add('active', selectedChar);
      };
    });

    btnKey.onclick = () => {
      const isVisible = keyBanner.style.display === 'flex';
      keyBanner.style.display = isVisible ? 'none' : 'flex';
      if (!isVisible) {
        apiKeyField.value = localStorage.getItem(STORAGE_KEY_API) || '';
        apiKeyField.focus();
      }
    };

    saveKeyBtn.onclick = () => {
      const val = apiKeyField.value.trim();
      if (val) {
        localStorage.setItem(STORAGE_KEY_API, val);
        keyBanner.style.display = 'none';
        alert('Chave salva com sucesso!');
      }
    };

    btnReset.onclick = () => {
      if (confirm('Deseja reiniciar a história e apagar as mensagens salvas?')) {
        history = [...INITIAL_SCENE];
        persistHistory();
        renderChat();
      }
    };

    textBox.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = this.scrollHeight + 'px';
    });

    sendTrigger.onclick = handleSend;

    async function handleSend() {
      const content = textBox.value.trim();
      if (!content) return;

      const apiKey = localStorage.getItem(STORAGE_KEY_API);
      if (!apiKey) {
        keyBanner.style.display = 'flex';
        apiKeyField.focus();
        alert('Cole a chave do OpenRouter no topo para enviar.');
        return;
      }

      textBox.value = '';
      textBox.style.height = 'auto';

      history.push({ role: 'user', text: content, error: false });
      persistHistory();
      renderChat();

      await dispatchApiCall(apiKey, selectedChar);
    }

    async function retryMessage(msgIndex) {
      const apiKey = localStorage.getItem(STORAGE_KEY_API);
      if (!apiKey) {
        keyBanner.style.display = 'flex';
        return;
      }
      history[msgIndex].error = false;
      delete history[msgIndex].errText;
      persistHistory();
      renderChat();
      await dispatchApiCall(apiKey, selectedChar);
    }

    async function dispatchApiCall(apiKey, charId) {
      sendTrigger.disabled = true;

      const tempRow = document.createElement('div');
      tempRow.className = `message-row char`;
      tempRow.innerHTML = `
        <div class="avatar ${charId}"></div>
        <div class="bubble-wrapper">
          <div class="bubble">
            <div class="dots-loader">
              <div class="dot"></div>
              <div class="dot"></div>
              <div class="dot"></div>
            </div>
          </div>
        </div>`;
      chatScroll.appendChild(tempRow);
      chatScroll.scrollTop = chatScroll.scrollHeight;

      const systemPrompt = `${SYSTEM_DIRECTIVE}\n\n[PERSONA ATIVA]\n${CHARS[charId].prompt}`;

      const apiMessages = [
        { role: 'system', content: systemPrompt },
        ...history.filter(m => !m.error || m === history[history.length - 1]).map(m => ({
          role: m.role === 'user' ? 'user' : 'assistant',
          content: m.char === 'narr' ? '[Narração] ' + m.text : m.text
        }))
      ];

      try {
        const callModel = (modelId) => fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.origin || 'https://callmeivyy.github.io',
            'X-Title': 'Blackwood University'
          },
          body: JSON.stringify({
            model: modelId,
            messages: apiMessages
          })
        });
        let res = await callModel('meta-llama/llama-3.3-70b-instruct:free');
        if (res.status === 404 || res.status === 400) {
          res = await callModel('openrouter/free');
        }

        let data = null;
        try { data = await res.json(); } catch (e) {}
        if (!res.ok) {
          const why = data && data.error && data.error.message ? data.error.message : '';
          if (res.status === 401) throw new Error('Chave do OpenRouter inválida (401). Toque em "Chave" e cole de novo.');
          if (res.status === 429) throw new Error('Limite do modelo gratuito atingido (429). Espere um pouco e tente de novo.');
          if (res.status === 404) throw new Error('Modelo não encontrado (404): ' + why);
          throw new Error('Erro ' + res.status + (why ? ': ' + why : ''));
        }

        const output = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : null;

        if (!output) throw new Error('Resposta vazia');

        history.push({
          role: 'assistant',
          char: charId,
          text: output
        });
        persistHistory();

      } catch (err) {
        console.error(err);
        const lastMsg = history[history.length - 1];
        if (lastMsg && lastMsg.role === 'user') {
          lastMsg.error = true;
          lastMsg.errText = (err && err.message) || 'Falha de conexão.';
          persistHistory();
        }
      } finally {
        sendTrigger.disabled = false;
        renderChat();
      }
    }

    // Inicialização
    loadSavedHistory();
    if (!localStorage.getItem(STORAGE_KEY_API)) {
      keyBanner.style.display = 'flex';
    }
    renderChat();
  </script>
</body>
</html>
