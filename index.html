o ritmo e pode parar quando quiser.", "t": 25, "tipo": "marco"}, {"ativo": false, "id": 23, "quem": "akira", "resumo": "Cassidy dá a Akira um 'passe livre' e pede que ela não pergunte mais; o beijo fica mais urgente e Akira a conduz para a cama.", "t": 26, "tipo": "marco"}, {"ativo": false, "id": 24, "quem": "akira", "resumo": "Akira deita Cassidy na cama e elas se beijam com desejo mútuo, a sós no quarto trancado.", "t": 27, "tipo": "marco"}], "h": [{"role": "assistant", "st": {"akira": [2, 4], "ren": [3, 3], "yuna": [3, 4]}, "view": {"ajustes": {"akira": {"a": 2, "b": 4, "pensamento": "Mais uma herdeira achando que o campus é dela. Quero ver quanto tempo ela aguenta."}, "ren": {"a": 3, "b": 3, "pensamento": "Ela não baixou o olhar quando eu falei. Isso é raro e vai me custar atenção."}, "yuna": {"a": 3, "b": 4, "pensamento": "Finalmente alguém com quem eu não preciso fingir. Vou apresentar a ela o campus de verdade."}}, "eventos": [{"quem": "todos", "resumo": "Cassidy chega a Blackwood no começo do semestre; Ren a adverte sobre as regras, Akira a provoca e Yuna a recebe com entusiasmo.", "tipo": "marco"}], "falas": [{"acao": "Desce dois degraus de um pulo, sem cerimônia, e para com as mãos nos bolsos da jaqueta.", "fala": "Você deve ser a Lancaster! Não liga pro pessoal, aqui todo mundo finge que se conhece há anos. Eu já gostei de você, e nem sei direito seu nome completo, mas vou descobrir.", "quem": "yuna"}, {"acao": "Ajusta o relógio no pulso sem desviar os olhos de Cassidy.", "fala": "Yuna, não bloqueie a passagem. Bem-vinda a Blackwood, Cassidy. Espero que você aprenda as regras daqui antes de quebrá-las, porque as pessoas costumam cobrar caro por isso.", "quem": "ren"}, {"acao": "Guarda o cigarro apagado no bolso da jaqueta com um sorriso de canto.", "fala": "Ela já quebrou uma regra, Ren. Chegou depois do horário, passou por todo mundo sem pedir licença e ainda assim parece que o campus está esperando por ela.", "quem": "akira"}], "memoria": "Início da história: Cassidy Lancaster chega a Blackwood University no começo do semestre. Na escadaria da biblioteca, Yuna a recebe com entusiasmo e quer mostrar o campus; Ren a observa e a adverte sobre as regras de Blackwood; Akira a provoca dizendo que ela já quebrou uma regra e parece no controle. Os três estão interessados em Cassidy, cada um à sua maneira.", "narracao": "O semestre começa em Blackwood com sol fraco e fofoca forte. Cassidy Lancaster desce do carro com malas de grife e um sorriso que faz o pátio inteiro desviar o olhar.\n\nNa escadaria da biblioteca, a família Kisaragi aparece no topo dos degraus. Só uma pessoa não se mexe: ela.", "presentes": ["ren", "akira", "yuna"], "resolve": []}}, {"content": "“bom dia, senhores. Lancaster.” você diz. “Cassidy lancaster” você complementa. ‘uau, essa japonesa com cara de marrenta é linda.’ “Me desculpa a pergunta, mas eu deveria pedir licença e distribuir sorrisos e bom dia a todos que cruzaram meu caminho após o portão,  @Akira?” você pergunta sem desviar o olhar. Ou ao menos tenta, mas seus olhos alternam entre os olhos e a boca dela, sem a menor preocupação dela perceber", "failed": false, "pending": false, "role": "user"}, {"role": "assistant", "st": {"akira": [4, 7], "ren": [4, 5], "yuna": [5, 6]}, "view": {"ajustes": {"akira": {"a": 2, "b": 3, "pensamento": "Ela me olha sem pedir desculpa. Finalmente alguém que não finge que não está olhando."}, "ren": {"a": 1, "b": 2, "pensamento": "Ela não baixa os olhos nem para mim nem para a Akira. Perigosamente interessante."}, "yuna": {"a": 2, "b": 2, "pensamento": "Gostei dela. Quero muito ver o Ren perder a pose por causa dessa garota."}}, "eventos": [{"quem": "akira", "resumo": "Cassidy se apresenta e desafia Akira com o olhar, deixando claro o interesse nela sem disfarçar.", "tipo": "marco"}], "falas": [{"acao": "Inclina a cabeça, um canto da boca se curvando devagar, e dá um passo à frente até reduzir a distância entre as duas, sem desviar o olhar.", "fala": "Deveria? Depende do que você quer que pensem de você, Lancaster. Mas, pela forma como você está me olhando, acho que bom dia é o menor dos seus interesses. Pode continuar, eu não cobro por observação.", "quem": "akira"}, {"acao": "Ajusta o punho da camisa com calma calculada, o olhar frio fixo em Cassidy.", "fala": "Ninguém exige sorrisos aqui. Exige-se compostura. Ainda assim, é curioso que a senhorita tenha escolhido justamente a minha irmã para testar os limites.", "quem": "ren"}, {"acao": "Se aproxima de Cassidy com os olhos brilhando, cutucando de leve o braço dela.", "fala": "Ignora o Ren, ele nasceu com a cara de tribunal. Eu gostei do seu bom dia, foi o mais honesto que ouvi esta semana. Depois da aula eu te levo para ver o lugar mais bonito do campus, topa?", "quem": "yuna"}], "memoria": "Cassidy chegou a Blackwood no começo do semestre. Na escadaria da biblioteca, Yuna a recebeu com entusiasmo e se ofereceu para mostrar o campus; Ren a advertiu sobre as regras; Akira a provocou. No turno 2, Cassidy se apresentou pelo nome completo e perguntou a Akira, sem desviar o olhar, se deveria distribuir bons dias, deixando o interesse evidente ao olhar para a boca dela. Akira respondeu com flerte, Ren reagiu com frieza e certa irritação contida, e Yuna convidou Cassidy para ver o lugar mais bonito do campus depois da aula. Nenhum conflito ativo.", "narracao": "A manhã em Blackwood tem cheiro de grama molhada e café requentado, e a luz pálida que atravessa as colunas da biblioteca desenha listras longas sobre os degraus de pedra. Ao fundo, um sino distante marca a hora enquanto estudantes passam depressa, lançando olhares curiosos para o pequeno grupo parado na escadaria.\n\nAkira encosta o ombro na coluna, o cigarro apagado girando entre os dedos, e deixa o silêncio esticar um segundo além do confortável. Percebe, sem a menor pressa de disfarçar que percebeu, o olhar de Cassidy descendo dos olhos até a boca e voltando. Ao lado, Ren mantém a postura impecável e o rosto impassí   const i=editIdx;S.h=S.h.slice(0,i);
  let last=null;for(let j=S.h.length-1;j>=0;j--){if(S.h[j].role==='assistant'&&S.h[j].snap){last=S.h[j];break}}
  if(last){S.st=JSON.parse(JSON.stringify(last.snap.st));S.mem=last.snap.mem;S.turno=last.snap.turno;S.ev=JSON.parse(JSON.stringify(last.snap.ev))}

async function runTurn(idx){

 try{
  if(navigator.onLine===false)throw {message:'Sem conexão com a internet no momento.'};
  const sample=await withTimeout(claude.use('sample'),15000);
  if(!sample)throw {message:'Não foi possível conectar ao OpenRouter.'};
  const hist=S.h.slice(0,idx+1).filter(x=>x.role==='user'||x.role==='assistant').slice(-12).map(x=>({role:x.role,content:x.content}));
  while(hist.length&&hist[0].role!=='user')hist.shift();
  const evs=S.ev.slice(-30).map(e=>`- #${e.id} [turno ${e.t}] ${e.tipo} (${e.quem}): ${e.resumo} — ${e.ativo?'ATIVO':'RESOLVIDO'}`).join('\n')||'(nenhum)';
  const ctx=SYS+`\n\nTURNO ATUAL: ${S.turno+1}\n\nMEMÓRIA CORRIDA:\n${S.mem}\n\nEVENTOS (rancores ativos continuam valendo até resolvidos):\n${evs}\n\nPERCENTUAIS ATUAIS: ${JSON.stringify(S.st)}\n\nMENSAGEM ATUAL DA USUÁRIA:\n`;

  S.st=st;S.turno+=1;
  const res=(r.resolve||[]).map(Number);
  S.ev.forEach(e=>{if(res.includes(e.id))e.ativo=false});
  (r.eventos||[]).forEach(e=>{S.ev.push({id:S.nextId++,t:S.turno,tipo:e.tipo,quem:e.quem,resumo:e.resumo,ativo:e.tipo==='conflito'})});
  if(r.memoria)S.mem=String(r.memoria).slice(0,1500);
