<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Blackwood University</title>
  <style>
    :root {
      --bg: #0f1118;
      --card-bg: #141721;
      --border: #232736;
      --text: #e6e8f0;
      --text-muted: #8b92a5;
      --bubble-user: #181c28;
      --bubble-char: #141722;
      --ren-color: #3b82f6;
      --akira-color: #ef4444;
      --yuna-color: #d946ef;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--bg);
    }

    header h1 {
      font-size: 1.25rem;
      font-family: "Times New Roman", Times, Georgia, serif;
      font-weight: 500;
      letter-spacing: 0.3px;
    }

    .header-btns {
      display: flex;
      gap: 8px;
    }

    .top-btn {
      background: #171a26;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .top-btn:active {
      background: #202434;
    }

    #key-banner {
      background: #131622;
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: none;
      flex-direction: column;
      gap: 8px;
      font-size: 0.85rem;
    }

    .key-input-row {
      display: flex;
      gap: 8px;
    }

    #api-key-field {
      flex: 1;
      background: #090a10;
      border: 1px solid var(--border);
      color: #fff;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    #save-key-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
    }

    #chat-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      -webkit-overflow-scrolling: touch;
    }

    .message-row {
      display: flex;
      gap: 12px;
      max-width: 90%;
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-row.char {
      align-self: flex-start;
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
      flex-shrink: 0;
      border: 2px solid #282d40;
    }

    .avatar.ren { border-color: var(--ren-color); background-color: #1e3a8a; }
    .avatar.akira { border-color: var(--akira-color); background-color: #7f1d1d; }
    .avatar.yuna { border-color: var(--yuna-color); background-color: #701a75; }
    .avatar.user { border-color: #64748b; background-color: #334155; }

    .bubble-wrapper {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .bubble {
      padding: 14px 16px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.55;
      word-break: break-word;
      border: 1px solid #1f2333;
    }

    .message-row.user .bubble {
      background: var(--bubble-user);
      border-top-right-radius: 4px;
      color: #e2e8f0;
    }

    .message-row.char .bubble {
      background: var(--bubble-char);
      border-top-left-radius: 4px;
      color: #e2e8f0;
    }

    .bubble em {
      color: #94a3b8;
      font-style: italic;
    }

    .status-error {
      color: #f87171;
      font-size: 0.78rem;
      margin-top: 4px;
      cursor: pointer;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .status-error span {
      border: 1px solid rgba(248, 113, 113, 0.4);
      padding: 2px 8px;
      border-radius: 12px;
      color: #fca5a5;
    }

    #footer-panel {
      padding: 12px 16px 24px 16px;
      background: var(--bg);
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-shrink: 0;
    }

    #character-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    #character-pills::-webkit-scrollbar {
      display: none;
    }

    .pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: #141724;
      border: 1px solid #23283c;
      color: #8f97ad;
      padding: 5px 14px 5px 6px;
      border-radius: 20px;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
    }

    .pill-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background-size: cover;
      background-position: center;
    }

    .pill.active.ren { border-color: var(--ren-color); color: #93c5fd; background: rgba(59, 130, 246, 0.12); }
    .pill.active.akira { border-color: var(--akira-color); color: #fca5a5; background: rgba(239, 68, 68, 0.12); }
    .pill.active.yuna { border-color: var(--yuna-color); color: #f0abfc; background: rgba(217, 70, 239, 0.12); }

    .input-row {
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    #text-box {
      flex: 1;
      background: #141724;
      border: 1px solid #23283c;
      color: #fff;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      resize: none;
      min-height: 48px;
      max-height: 120px;
      outline: none;
      line-height: 1.4;
    }

    #text-box:focus {
      border-color: #3b425a;
    }

    .send-actions {
      display: flex;
      gap: 6px;
    }

    .round-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #181b28;
      border: 1px solid #262b3d;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .round-btn:active {
      background: #222638;
    }

    .round-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .dots-loader {
      display: flex;
      gap: 4px;
      padding: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      background: #94a3b8;
      border-radius: 50%;
      animation: blink 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
      40% { opacity: 1; transform: scale(1.1); }
    }

.jn-bar .t i{display:block;height:100%}

        { role: 'system', content: systemPrompt },
        ...history.filter(m => m.char !== 'sys' && (!m.error || m === history[history.length - 1])).slice(-24).map(m => ({
          role: m.role === 'user' ? 'user' : 'assistant',
          content: m.role === 'user' ? m.text : (m.char === 'narr' ? m.text : (CHARS[m.char] ? CHARS[m.char].name + ': ' : '') + m.text)
        }))
      ];
      const lastU = apiMessages[apiMessages.length - 1];
      if (lastU && lastU.role === 'user') {
        lastU.content += '\n\n(Responda em português do Brasil natural, no formato "Nome: *ação* \"fala\"", um personagem por linha, e termine com as linhas #JANELA, #PRESENTES e #MEMORIA.)';
      }

      try {
        const callModel = (modelId) => fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json',
            'HTTP-Referer': window.location.origin || 'https://callmeivyy.github.io',
            'X-Title': 'Blackwood University'
          },
          body: JSON.stringify({
            model: modelId,
            messages: apiMessages
          })
        });
        const res = await callModel(selectedModel());

        let data = null;
        try { data = await res.json(); } catch (e) {}
        if (!res.ok) {
          const why = data && data.error && data.error.message ? data.error.message : '';
          if (res.status === 401) throw new Error('Chave do OpenRouter inválida (401). Toque em "Chave" e cole de novo.');
          if (res.status === 402) throw new Error('Sem créditos no OpenRouter (402). Adicione créditos ou troque de modelo.');
          if (res.status === 429) throw new Error('Limite de uso atingido (429). Espere um pouco e tente de novo.');
          if (res.status === 404) throw new Error('Modelo não encontrado (404): ' + why);
          throw new Error('Erro ' + res.status + (why ? ': ' + why : ''));
        }

        const output = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : null;

        if (!output) throw new Error('Resposta vazia');

        const janela = [];
        const jRe = /^\s*[#*]*\s*JANELA\s*[:\-]?\s*(Ren|Akira|Yuna)\s*\|\s*([+-]?\d+)\s*%?\s*\|\s*([+-]?\d+)\s*%?\s*\|?\s*(.*)$/i;
        const kept = [];
        let novosPresentes = null, novaMem = null;
        const novosEventos = [], resolvidos = [];
        const keyRe = /^\s*[#*]*\s*\[?(JANELA|PRESENTES|EVENTO|RESOLVE|MEMORIA|MEMÓRIA|REGISTRO)\b\]?\s*[:\-]?\s*(.*)$/i;
        String(output).split(/\n/).forEach(line => {
          const m = line.match(jRe);
          if (m) {
            const cl = x => Math.max(-5, Math.min(5, parseInt(x, 10) || 0));
            janela.push({ c: m[1].toLowerCase(), d: [cl(m[2]), cl(m[3])], p: m[4].trim() });
            return;
          }
          const k = line.match(keyRe);
          if (!k) { kept.push(line); return; }
          const tipo = k[1].toUpperCase(), val = k[2].trim();
          if (tipo === 'PRESENTES') {
            novosPresentes = ['ren', 'akira', 'yuna'].filter(c => new RegExp('\\b' + CHARS[c].name + '\\b', 'i').test(val));
          } else if (tipo === 'EVENTO') {
            const p = val.split('|').map(x => x.trim());
            if (p.length >= 3 && p[2]) novosEventos.push({ tipo: p[0].toLowerCase().replace('ç', 'c').replace('ã', 'a'), quem: p[1], resumo: p.slice(2).join(' | ') });
          } else if (tipo === 'RESOLVE') {
            (val.match(/\d+/g) || []).forEach(n => resolvidos.push(+n));
          } else if (tipo.startsWith('MEM')) {
            if (val) novaMem = val.slice(0, 900);
          }
        });
        const output2 = kept.join('\n');
        const segs = [];
        let cur = null;
        const tagRe = /^\s*[*_]*\s*(Ren|Akira|Yuna)(?:\s+Kisaragi)?\s*(?:\*\*|__)?\s*:\s*(?:\*\*|__)?\s*/i;
        String(output2).split(/\n/).forEach(line => {
          const m = line.match(tagRe);
          if (m) {
            cur = { char: m[1].toLowerCase(), lines: [line.replace(tagRe, '')] };
            segs.push(cur);
          } else if (line.trim()) {
            if (!cur) { cur = { char: 'narr', lines: [] }; segs.push(cur); }
            cur.lines.push(line);
          }
        });
        const anyTag = segs.some(x => x.char !== 'narr');
        if (!anyTag) {
          const parts = String(output2).split(/(\*[^*]+\*)/).map(x => x.trim()).filter(Boolean);
          const out = [];
          let curChar = null;
          const nameRe = /^\*?\s*(Ren|Akira|Yuna)\b/i;
          parts.forEach(p => {
            const nm = p.match(nameRe);
            if (p.startsWith('*') && nm) curChar = nm[1].toLowerCase();
            const c = curChar || (targets.length ? targets[0] : 'narr');
            const last = out[out.length - 1];
            if (last && last.char === c) last.text += ' ' + p;
            else out.push({ role: 'assistant', char: c, text: p });
          });
          out.forEach(x => history.push(x));
        } else {
          segs.forEach(x => {
            const t = x.lines.join('\n').trim();
            if (t) history.push({ role: 'assistant', char: x.char, text: t });
          });
        }
        const st = STATE.st;
        janela.forEach(x => { [0, 1].forEach(k => { st[x.c][k] = Math.max(0, Math.min(100, st[x.c][k] + x.d[k])); }); });
        const turno = STATE.turno + 1;
        const ev = STATE.ev;
        let nextId = STATE.nextId;
        ev.forEach(e => { if (resolvidos.includes(e.id)) e.ativo = false; });
        novosEventos.forEach(e => ev.push({ id: nextId++, t: turno, tipo: e.tipo, quem: e.quem, resumo: e.resumo, ativo: e.tipo.startsWith('conflito') }));
        const falaram = [...new Set(history.slice(-12).filter(h => CHARS[h.char]).map(h => h.char))];
        const presentes = novosPresentes || STATE.presentes;
        history.push({ role: 'assistant', char: 'sys', janela, st, turno, mem: novaMem || STATE.mem, ev, nextId, presentes });
        persistHistory();

      } catch (err) {
        console.error(err);
        const lastMsg = history[history.length - 1];
        if (lastMsg && lastMsg.role === 'user') {
          lastMsg.error = true;
          lastMsg.errText = (err && err.message) || 'Falha de conexão.';
          persistHistory();
        }
      } finally {
        sendTrigger.disabled = false;
        continueTrigger.disabled = false;
        renderChat();
      }
    }

    // Inicialização
    loadSavedHistory();
    if (!localStorage.getItem(STORAGE_KEY_API)) {
      keyBanner.style.display = 'flex';
    }
    renderChat();
  </script>
</body>
</html>
